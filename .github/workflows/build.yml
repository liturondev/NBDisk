name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Arch Linux is covered by the package-arch job, whose PKGBUILD check()
        # runs the test suite as part of the package build.
        include:
          - name: Debian 13
            distro: debian
            image: debian:trixie
          - name: Ubuntu 26.04
            distro: ubuntu
            image: ubuntu:26.04
          - name: Fedora
            distro: fedora
            image: fedora:latest
          - name: openSUSE Tumbleweed
            distro: opensuse
            image: opensuse/tumbleweed
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install git before checkout
        run: |
          set -eu
          case "${{ matrix.distro }}" in
              debian | ubuntu)
                  export DEBIAN_FRONTEND=noninteractive
                  apt-get update
                  apt-get install -y --no-install-recommends git ca-certificates
                  ;;
              fedora)
                  dnf install -y git ca-certificates
                  ;;
              opensuse)
                  zypper --non-interactive install git ca-certificates
                  ;;
          esac
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: .github/ci/install-deps.sh ${{ matrix.distro }}
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  package-arch:
    name: Package (Arch Linux)
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install git before checkout
        run: |
          set -eu
          pacman -Sy --noconfirm --needed git ca-certificates
      - uses: actions/checkout@v4
      - name: Build package
        run: .github/ci/package-arch.sh
      - uses: actions/upload-artifact@v4
        with:
          name: nbdisk-arch
          path: dist/*.pkg.tar.zst
          if-no-files-found: error

  package-deb:
    name: Package (Debian)
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - name: Install git before checkout
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
      - name: Build package
        run: .github/ci/package-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: nbdisk-debian
          path: dist/*.deb
          if-no-files-found: error

  package-rpm:
    name: Package (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Fedora
            distro: fedora
            image: fedora:latest
          - name: openSUSE Tumbleweed
            distro: opensuse
            image: opensuse/tumbleweed
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install git before checkout
        run: |
          set -eu
          case "${{ matrix.distro }}" in
              fedora)
                  dnf install -y git ca-certificates
                  ;;
              opensuse)
                  zypper --non-interactive install git ca-certificates
                  ;;
          esac
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          set -eu
          .github/ci/install-deps.sh ${{ matrix.distro }}
          case "${{ matrix.distro }}" in
              fedora) dnf install -y rpm-build ;;
              opensuse) zypper --non-interactive install rpm-build ;;
          esac
      - name: Build package
        run: .github/ci/package-rpm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: nbdisk-rpm-${{ matrix.distro }}
          path: dist/rpms/*.rpm
          if-no-files-found: error
